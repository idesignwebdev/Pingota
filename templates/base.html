{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}MikroTik hotspot billing with Paystack and M-Pesa. Guests pay, the router opens access, and passes end on time.{% endblock %}">
  <meta name="theme-color" content="#14213D">
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Poppins:wght@600&amp;display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
  <script src="{% static 'js/ui.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
