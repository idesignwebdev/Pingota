{% extends "portal/base_portal.html" %}
{% block title %}Too many tries - {{ isp.name|default:"Pingota" }}{% endblock %}

{% block portal %}
<div class="portal__lead">
  <h1>Too many tries</h1>
</div>

<div class="alert alert--err" role="alert" style="margin:20px 0">
  <span class="alert__label">What happened</span>
  {{ message }}
</div>

<div class="row" style="gap:8px; flex-wrap:wrap">
  <a class="btn btn--primary" href="{{ retry_url|default:'/portal/' }}">{{ retry_label|default:"Try again" }}</a>
  {% if isp %}
    <a class="btn btn--secondary" href="/portal/{{ isp.slug }}/">Back to my pass</a>
  {% endif %}
</div>
{% endblock %}
