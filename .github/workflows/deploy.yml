name: build-and-push

# Builds the image once and pushes it to GHCR. Dokploy then pulls
# ghcr.io/<owner>/pingota:latest (or a tag) instead of rebuilding on the server,
# which is what keeps deploys fast and RAM low on a small VPS.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pingota

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Django checks
        env:
          DJANGO_SECRET_KEY: ci-only
          FIELD_ENCRYPTION_KEY: ZMD6DO1R8ZmXwA-qxTiemkgDNI3ZqSWbaSyoZWCSe5Q=
        run: |
          python manage.py check --deploy --fail-level ERROR || python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        env:
          DJANGO_SECRET_KEY: ci-only
          FIELD_ENCRYPTION_KEY: ZMD6DO1R8ZmXwA-qxTiemkgDNI3ZqSWbaSyoZWCSe5Q=
        run: python manage.py test --verbosity 2

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy hook
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK" ]; then
            curl -fsS -X POST "$DOKPLOY_WEBHOOK"
          else
            echo "DOKPLOY_WEBHOOK is not set; skipping deploy."
          fi
